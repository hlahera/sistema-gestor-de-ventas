# Blueprint Render: API Django + frontend React + PostgreSQL
# En Render: New → Blueprint → conecta este repo → Apply
databases:
  - name: producmarket-db
    plan: free
    databaseName: producmarket
    user: producmarket

services:
  - type: web
    name: producmarket-api
    runtime: python
    plan: free
    rootDir: producmarket
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: producmarket-db
          property: connectionString
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: producmarket-api
          property: host
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: producmarket-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CSRF_TRUSTED_ORIGINS
        fromService:
          type: web
          name: producmarket-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SERVE_MEDIA
        value: "true"

  - type: web
    name: producmarket-web
    runtime: static
    rootDir: producmarket-frontend-cra
    buildCommand: chmod +x build.sh && ./build.sh
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: producmarket-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: REACT_APP_MEDIA_URL
        fromService:
          type: web
          name: producmarket-api
          envVarKey: RENDER_EXTERNAL_URL
