# Blueprint opcional para Render.com
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: producmarket-api
    runtime: python
    rootDir: producmarket
    buildCommand: ./build.sh
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SERVE_MEDIA
        value: "true"
    disk:
      name: producmarket-media
      mountPath: media
      sizeGB: 1
